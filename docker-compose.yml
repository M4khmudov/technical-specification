name: candles

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-candles}:${POSTGRES_PASSWORD:-candles}@db:5432/${POSTGRES_DB:-candles}
  TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-candles}:${POSTGRES_PASSWORD:-candles}@db:5432/candles_test
  REDIS_URL: redis://redis:6379/0
  RATES_SERVICE_URL: http://mocks:8001/rates
  MARKING_SERVICE_URL: http://mocks:8001/marking
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL_PRIMARY: ${OPENAI_MODEL_PRIMARY:-gpt-4.1}
  OPENAI_MODEL_FALLBACK: ${OPENAI_MODEL_FALLBACK:-gpt-4.1-mini}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
  JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-of-32-plus-chars}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-candles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-candles}
      POSTGRES_DB: ${POSTGRES_DB:-candles}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  mocks:
    build: ./mocks
    ports:
      - "8001:8001"

  backend:
    build: ./backend
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      mocks: { condition: service_started }

  worker:
    build: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    environment: *backend-env
    depends_on:
      backend: { condition: service_started }

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
