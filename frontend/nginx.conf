server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        # SSE: ответы ассистента нельзя буферизовать
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location ~ ^/(docs|openapi.json) {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
