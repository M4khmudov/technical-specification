# В журнал доступа — путь без строки запроса: в параметрах бывают названия поставщиков
# и ФИО (фильтр реестра партий), им не место в логах
log_format no_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent';

server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log no_query;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        # Адрес клиента для бэкенда (ограничение попыток входа). Заменяем, а не дописываем:
        # заголовок от клиента подделать нельзя
        proxy_set_header X-Forwarded-For $remote_addr;
        # SSE: ответы ассистента нельзя буферизовать
        proxy_buffering off;
        proxy_read_timeout 300s;
        # Файлы для анализа — до 5 МБ (проверяет бэкенд); запас на multipart
        client_max_body_size 6m;
    }

    location ~ ^/(docs|openapi.json) {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
